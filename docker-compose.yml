version: '3.8'

services:
  redis:
    image: redis:7
    container_name: foodingo-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foodingo-app:local
    container_name: foodingo-app
    volumes:
      - ./:/app
    working_dir: /app
    command: /bin/bash -c "uvicorn live_app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./foodingo.db
    depends_on:
      - redis
    restart: on-failure
